<!doctype html>
<!--
  Ninguém Sabe · cartão final dos últimos 4 s de cada corte vertical (1080x1920). REGRA FIXA 8:
  "A HISTÓRIA COMPLETA JÁ ESTÁ NO CANAL" + "Toque no link aqui embaixo" + seta vermelha animada apontando
  para baixo (onde a plataforma mostra o link do vídeo relacionado). Fica sobre o último quadro do corte,
  congelado (variável "ate" da cena), com um véu escuro. Os ~12% de baixo ficam livres para a interface.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cartão final do corte</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #cfim-raiz { position: absolute; inset: 0; overflow: hidden; font-family: Montserrat; color: #f4f2ee; }
      #cfim-veu { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 6, 8, 0.8) 0%, rgba(6, 6, 8, 0.86) 55%, rgba(6, 6, 8, 0.9) 100%); opacity: 0; }
      #cfim-canal { position: absolute; left: 0; right: 0; top: 360px; text-align: center; opacity: 0; }
      #cfim-canal span { display: inline-block; padding: 14px 40px; border-radius: 999px; background: #c4161c; font-weight: 900; font-size: 40px; letter-spacing: 0.14em; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.45); }
      #cfim-titulo { position: absolute; left: 60px; right: 60px; top: 560px; text-align: center; font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -0.005em; text-transform: uppercase; }
      .cfim-linha { display: block; opacity: 0; -webkit-text-stroke: 7px #000; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0, 0, 0, 0.6); }
      .cfim-vermelho { color: #e3121b; }
      #cfim-toque { position: absolute; left: 60px; right: 60px; top: 1090px; text-align: center; font-weight: 700; font-size: 58px; color: #ece8e2; opacity: 0; -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 0 5px 0 rgba(0, 0, 0, 0.55); }
      #cfim-seta { position: absolute; left: 50%; top: 1250px; width: 170px; height: 230px; margin-left: -85px; opacity: 0; transform-origin: 50% 0%; }
    </style>
  </head>
  <body>
    <div id="cfim-raiz" data-composition-id="cartao-final" data-width="1080" data-height="1920" data-duration="4">
      <div id="cfim-veu"></div>
      <div id="cfim-canal"><span>NINGUÉM SABE</span></div>
      <div id="cfim-titulo">
        <span class="cfim-linha">A história</span>
        <span class="cfim-linha cfim-vermelho">completa</span>
        <span class="cfim-linha">já está</span>
        <span class="cfim-linha">no canal</span>
      </div>
      <div id="cfim-toque">Toque no link aqui embaixo</div>
      <svg id="cfim-seta" viewBox="0 0 170 230" aria-hidden="true">
        <path d="M60 8 h50 v112 h48 L85 222 12 120 h48 z" fill="#e3121b" stroke="#0b0b0c" stroke-width="10" stroke-linejoin="round" />
      </svg>
    </div>
    <script>
      (function () {
        var raiz = document.getElementById("cfim-raiz");
        var q = function (s) { return raiz.querySelector(s); };
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(q("#cfim-veu"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
        tl.fromTo(q("#cfim-canal"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.1);
        raiz.querySelectorAll(".cfim-linha").forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" }, 0.18 + i * 0.09);
        });
        tl.fromTo(q("#cfim-toque"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.62);
        // a seta entra e quica para baixo, apontando para o link (determinístico: só a timeline)
        tl.fromTo(q("#cfim-seta"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.75);
        tl.fromTo(q("#cfim-seta"), { y: 0 }, { y: 30, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 6 }, 1.1);
        window.__timelines = window.__timelines || {};
        window.__timelines["cartao-final"] = tl;
      })();
    </script>
  </body>
</html>
