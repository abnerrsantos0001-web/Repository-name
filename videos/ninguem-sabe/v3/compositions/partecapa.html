<!doctype html>
<!--
  Ninguém Sabe · Vídeo 3 · Capa do vídeo longo: "VOCÊ TEM 7 DIAS" em vermelho sobre um quadro da cena. Gerado por tools/gerar_capas.py.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Capa do vídeo longo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #pccapa-raiz { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; font-family: Montserrat; }
      #pccapa-fundo { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
      #pccapa-vinheta { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0) 100%); }
      #pccapa-texto { position: absolute; left: 90px; right: 90px; top: 90px; text-align: left; font-weight: 900; font-size: 151px;
        line-height: 0.96; letter-spacing: -0.01em; text-transform: uppercase; color: #e3121b; -webkit-text-stroke: 6px #0b0b0c;
        paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0, 0, 0, 0.7), 0 0 60px rgba(0, 0, 0, 0.65); }
      .pccapa-linha { display: block; }
    </style>
  </head>
  <body>
    <div id="pccapa-raiz" data-composition-id="partecapa" data-width="1920" data-height="1080" data-duration="2">
      <img id="pccapa-fundo" src="capa/fundos/capa-v3.png" alt="" />
      <div id="pccapa-vinheta"></div>
      <div id="pccapa-texto"><span class="pccapa-linha">VOCÊ TEM</span><span class="pccapa-linha">7 DIAS</span></div>
    </div>
    <script>
      (function () {
        var raiz = document.getElementById("pccapa-raiz");
        var tl = gsap.timeline({ paused: true });
        // parado: a capa é um quadro só (o snapshot é em t=1 s); o set dá duração à timeline
        tl.set(raiz.querySelector("#pccapa-texto"), { opacity: 1 }, 0).set({}, {}, 2);
        window.__timelines = window.__timelines || {};
        window.__timelines["partecapa"] = tl;
      })();
    </script>
  </body>
</html>
