<!doctype html>
<!--
  Ninguém Sabe · Vídeo 1 · cartão dos últimos 4 s de cada corte vertical (1080x1920).
  O título muda por corte ("Parte 2 amanhã", ...) via data-variable-values no host (tools/gerar_raizes.py).
-->
<html
  lang="pt-BR"
  data-composition-variables='[{"id":"titulo","type":"string","label":"Título","default":"Parte 2 amanhã"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cartão do corte</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #cartao-raiz { position: absolute; inset: 0; overflow: hidden; font-family: Montserrat; color: #f4f2ee; }
      #cartao-fundo { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 46%, rgba(8, 8, 10, 0.78), rgba(4, 4, 5, 0.96)); opacity: 0; }
      #cartao-bloco { position: absolute; left: 80px; right: 80px; top: 600px; text-align: center; }
      #cartao-rotulo { font-weight: 800; font-size: 40px; letter-spacing: 0.26em; color: #e0262d; opacity: 0; }
      #cartao-titulo { margin-top: 34px; font-weight: 900; font-size: 116px; line-height: 1.04; text-shadow: 0 8px 0 rgba(0, 0, 0, 0.6); opacity: 0; }
      #cartao-barra { width: 200px; height: 12px; margin: 54px auto 0; background: #c4161c; transform-origin: 50% 50%; }
      #cartao-yt { margin-top: 64px; font-weight: 600; font-size: 50px; line-height: 1.3; color: #d6d3cd; opacity: 0; }
      #cartao-canal { display: inline-block; margin-top: 30px; padding: 22px 54px; border-radius: 999px; background: #c4161c; font-weight: 900; font-size: 64px; letter-spacing: 0.08em; color: #f4f2ee; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.45); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="cartao-raiz" data-composition-id="cartao" data-width="1080" data-height="1920" data-duration="4">
      <div id="cartao-fundo"></div>
      <div id="cartao-bloco">
        <div id="cartao-rotulo">CONTINUA</div>
        <div id="cartao-titulo">Parte 2 amanhã</div>
        <div id="cartao-barra"></div>
        <div id="cartao-yt">História completa no YouTube:</div>
        <div id="cartao-canal">NINGUÉM SABE</div>
      </div>
    </div>
    <script>
      (function () {
        var raiz = document.getElementById("cartao-raiz");
        var v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        if (v.titulo) raiz.querySelector("#cartao-titulo").textContent = v.titulo;
        var q = function (s) { return raiz.querySelector(s); };
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(q("#cartao-fundo"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
        tl.fromTo(q("#cartao-rotulo"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.15);
        tl.fromTo(q("#cartao-titulo"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 0.25);
        tl.fromTo(q("#cartao-barra"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 0.5);
        tl.fromTo(q("#cartao-yt"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 0.8);
        tl.fromTo(q("#cartao-canal"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.0);
        tl.to(q("#cartao-canal"), { scale: 1.04, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.8);
        window.__timelines = window.__timelines || {};
        window.__timelines["cartao"] = tl;
      })();
    </script>
  </body>
</html>
