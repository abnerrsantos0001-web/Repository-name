  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // só o primeiro fromTo de cada elemento aplica o estado inicial na hora; os seguintes esperam a vez,
      // senão o último criado (ex.: o escuro em opacidade 1) valeria desde o começo
      const jaUsado = new Set();
      function fromTo(id, de, para, t) {
        const primeiro = !jaUsado.has(id);
        jaUsado.add(id);
        return tl.fromTo(id, de, { ...para, immediateRender: primeiro }, t);
      }
      // zoom e panorâmica: chaves [t, escala, x, y] por quadro (origem no centro; nenhum valor mostra a borda da imagem).
      // Cada trecho entre duas chaves é um fromTo explícito, então qualquer quadro sai igual em qualquer ordem.
      function camera(id, chaves, ease) {
        for (let i = 1; i < chaves.length; i++) {
          const [t0, s0, x0, y0] = chaves[i - 1];
          const [t1, s1, x1, y1, e] = chaves[i];
          fromTo(id, { scale: s0, x: x0, y: y0 }, { scale: s1, x: x1, y: y1, duration: t1 - t0, ease: e || ease }, t0);
        }
      }
      // 1 · rosto no travesseiro: aproxima devagar
      camera("#ct-q01", [[0, 1.03, 0, 0], [1.4, 1.1, -10, 6]], "none");
      // 2 · relógio: centraliza o 7:12 e aproxima
      camera("#ct-q02", [[1.4, 1.1, 60, 0], [3.7, 1.16, 100, -20]], "sine.inOut");
      // 3 · do quarto inteiro até o rosto dele
      camera("#ct-q03", [[3.7, 1.05, 0, 0], [9.0, 1.22, -60, 115]], "sine.inOut");
      // 4 · pela janela: a rua; o carro ("nenhum carro"); a casinha ("nenhum cachorro"); as casas ("nenhum vizinho")
      camera(
        "#ct-q04",
        [
          [9.0, 1.08, 0, 0],
          [10.8, 1.1, 0, -8, "none"],
          [12.1, 1.18, 30, -90],
          [12.3, 1.18, 30, -90, "none"],
          [13.8, 1.25, 235, -40],
          [14.6, 1.25, 235, -40, "none"],
          [16.1, 1.18, -168, 0],
        ],
        "power2.inOut",
      );
      // 5 · celular: chega perto da tela e entra de vez no 03:33
      camera(
        "#ct-q05",
        [
          [16.15, 1.0, 0, 0],
          [17.3, 1.02, 0, -10, "none"],
          [18.15, 1.35, 0, -189, "power2.inOut"],
          [22.2, 1.38, 0, -200, "none"],
          [26.3, 1.39, -10, -205, "none"],
          [27.6, 1.6, -150, -300, "power2.inOut"],
          [29.4, 1.62, -155, -306, "none"],
        ],
      );
      // 6 · grito: aproxima do rosto
      camera("#ct-q06", [[29.4, 1.0, 0, 0], [32.6, 1.1, 0, 20]], "sine.inOut");
      // 7 · avenida: começa nele e abre para a rua vazia
      camera("#ct-q07", [[33.7, 1.22, 0, -115], [39.9, 1.02, 0, -5]], "sine.inOut");

      // tela do celular, no ritmo da fala
      const aparece = (id, t, de, para, dur, ease) => fromTo(id, de, { ...para, duration: dur, ease }, t);
      aparece("#ct-bloqueio", 18.1, { opacity: 1 }, { opacity: 0 }, 0.18, "power2.in");
      aparece("#ct-msg", 18.21, { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, 0.25, "power3.out"); // "Zero mensagens"
      aparece("#ct-notif", 20.08, { opacity: 0, y: 10 }, { opacity: 1, y: 0 }, 0.25, "power3.out"); // "Zero notificações"
      aparece("#ct-msg", 22.1, { opacity: 1 }, { opacity: 0 }, 0.15, "power2.in");
      aparece("#ct-notif", 22.1, { opacity: 1 }, { opacity: 0 }, 0.15, "power2.in");
      aparece("#ct-feed", 22.27, { opacity: 0 }, { opacity: 1 }, 0.25, "power2.out"); // "O último post"
      aparece("#ct-post", 22.27, { y: 14 }, { y: 0 }, 0.35, "power3.out");
      aparece("#ct-hora", 26.55, { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1 }, 0.25, "back.out(2)"); // "3h33"
      aparece("#ct-hora-risco", 26.75, { scaleX: 0 }, { scaleX: 1 }, 0.3, "power2.out");

      // "Nada.": a tela escurece; a avenida volta do escuro
      aparece("#ct-escuro", 32.59, { opacity: 0 }, { opacity: 0.85 }, 0.55, "power1.in");
      aparece("#ct-escuro", 33.15, { opacity: 0.85 }, { opacity: 1 }, 0.45, "none");
      aparece("#ct-escuro", 33.7, { opacity: 1 }, { opacity: 0 }, 0.6, "power2.out");

      // "sumiu": tremor curto que some (no invólucro de fora, para não brigar com o zoom do quadro)
      const tremor = [
        [0, 0],
        [14, -8],
        [-12, 9],
        [10, -6],
        [-7, 5],
        [5, -3],
        [-2, 2],
        [0, 0],
      ];
      for (let i = 1; i < tremor.length; i++) {
        const [x0, y0] = tremor[i - 1];
        const [x1, y1] = tremor[i];
        fromTo("#ct-t07", { x: x0, y: y0 }, { x: x1, y: y1, duration: 0.06, ease: "none" }, 38.35 + (i - 1) * 0.06);
      }

      window.__timelines["parte01-cartoon"] = tl;
    })();
  </script>
