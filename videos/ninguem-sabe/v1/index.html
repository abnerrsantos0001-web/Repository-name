<!doctype html>
<!--
  Ninguém Sabe · Vídeo 1 · "E se você acordasse e TODO MUNDO tivesse sumido?"
  Por enquanto só a parte 01 (para aprovar o visual). As partes 02 a 11 entram em sequência,

-->
<html lang="pt-BR" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0c0d0f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.93"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="parte01"
        class="clip"
        data-composition-id="parte01"
        data-composition-src="compositions/parte01.html"
        data-start="0"

        data-track-index="1"

        data-width="1920"
        data-height="1080"

      <div
        id="legendas-p01"

        data-track-index="2"

        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <audio
        id="narracao-p01"

      ></audio>

      <audio
        id="trilha-p01"

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
