<!doctype html>
<!--
  Ninguém Sabe · Vídeo 1 · Parte capa: capa do vídeo 1: ele sozinho na avenida vazia
  Motor em assets/js/cena.js; esqueleto gerado por tools/nova_parte.py.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Parte capa</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #pcapa-raiz { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; }
      #pcapa-tela { position: absolute; left: 0; top: 0; display: block; }
      #pcapa-vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 68% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
      #pcapa-escuro { position: absolute; inset: 0; background: #000; opacity: 0; }
      #pcapa-fonte { position: absolute; left: 0; top: 0; opacity: 0; font-family: Inter; font-weight: 700; font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="pcapa-raiz" data-composition-id="partecapa" data-width="1920" data-height="1080" data-duration="2.0">
      <canvas id="pcapa-tela" width="1920" height="1080"></canvas>
      <div id="pcapa-vinheta"></div>
      <div id="pcapa-texto" data-layout-ignore>
        <div class="pcapa-linha">CADÊ TODO</div>
        <div class="pcapa-linha">MUNDO?</div>
      </div>
      <style>
        #pcapa-texto { position: absolute; left: 96px; top: 120px; font-family: Montserrat; font-weight: 900; font-size: 196px; line-height: 0.98; letter-spacing: -0.01em; color: #e3121b; -webkit-text-stroke: 6px #0b0b0c; paint-order: stroke fill; text-shadow: 0 12px 0 rgba(0, 0, 0, 0.7), 0 0 60px rgba(0, 0, 0, 0.6); }
      </style>
      <div id="pcapa-escuro"></div>
      <div id="pcapa-fonte" data-layout-ignore>Aa 0123456789</div>
    </div>
    <script>
      (function () {
        // relógio da parte: tween linear que chama host.render(t); o motor (cena.js) pendura a cena nele.
        // O HyperFrames roda este script mais de uma vez (cópia escondida e cópia visível): cada passada avisa o motor.
        var id = "partecapa";
        var raiz = document.getElementById("pcapa-raiz");
        var duracao = parseFloat(raiz.dataset.duration) || 2.0;
        var relogio = { t: 0 };
        var host = {
          relogio: relogio,
          duracao: duracao,
          tela: document.getElementById("pcapa-tela"),
          escuro: document.getElementById("pcapa-escuro"),
          // vertical quando o host que monta a cena é mais alto que largo (cortes 9:16)
          vars: { formato: raiz.parentElement && Number(raiz.parentElement.dataset.height) > Number(raiz.parentElement.dataset.width) ? "vertical" : "horizontal" },
          render: null,
        };
        window["__" + id] = host;
        // no corte vertical a raiz da cena ocupa o quadro 1080x1920 inteiro
        if (host.vars.formato === "vertical") {
          raiz.dataset.width = "1080";
          raiz.dataset.height = "1920";
          raiz.style.width = "1080px";
          raiz.style.height = "1920px";
        }
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady[id] = new Promise(function (resolve) {
          host.pronto = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(relogio, { t: duracao, duration: duracao, ease: "none", onUpdate: function () { if (host.render) host.render(relogio.t); } });
        host.tl = tl;
        if (window.__extras && window.__extras[id]) window.__extras[id](tl, raiz);
        window.__timelines = window.__timelines || {};
        window.__timelines[id] = tl;
        if (window.__aoHost && window.__aoHost[id]) window.__aoHost[id](host);
      })();
    </script>
    <script type="module">
      import { iniciarParte, MEDIDAS } from "./assets/js/cena.js";

      const ALT = MEDIDAS.quadrilEmPe;
      // capa: ele sozinho no meio da avenida vazia, carros largados, a torre lá no fundo
      iniciarParte({
        host: "__partecapa",
        cenarios: ["cidade"],
        planos: [{ de: 0, cenario: "cidade", nome: "capa", modo: "dia" }],
        cameras: { capa: { k: [[0, [-0.75, 1.1, 4.0], [1.9, 2.2, -14], 42], [2, [-0.75, 1.1, 4.0], [1.9, 2.2, -14], 42]], tremor: 0 } },
        personagem: {
          onde: [[0, "cidade"]],
          pos: [[0, [0.9, ALT, 0.8]]],
          pose: { giro: [[0, -0.35]], cabecaInclina: [[0, -0.12]], cabecaGiro: [[0, 0.35]], olhos: [[0, 1.3]], apertar: [[0, 0.25]], boca: [[0, 0.18]], abertura: [[0, 0.35]], cotovelo: [[0, 0.3]] },
        },
        quadro: (tt, plano, ctx) => {
          ctx.cenarios.cidade.luzes(0);
          ctx.cenarios.cidade.semaforos(true);
          ctx.cenarios.cidade.fumaca(false);
        },
      });

    </script>
  </body>
</html>
