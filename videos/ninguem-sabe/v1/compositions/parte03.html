<!doctype html>
<!--
  Ninguém Sabe · Vídeo 1 · Parte 03: o primeiro dia de liberdade: o shopping aceso e vazio, o tênis, a vitrine, a praça de alimentação, a concessionária e o carro vermelho a 200 por hora
  Motor em assets/js/cena.js; esqueleto gerado por tools/nova_parte.py.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Parte 03</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      #p03-raiz { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; }
      #p03-tela { position: absolute; left: 0; top: 0; display: block; }
      #p03-vinheta { position: absolute; inset: 0; background: radial-gradient(ellipse 72% 68% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%); }
      #p03-escuro { position: absolute; inset: 0; background: #000; opacity: 0; }
      #p03-fonte { position: absolute; left: 0; top: 0; opacity: 0; font-family: Inter; font-weight: 700; font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="p03-raiz" data-composition-id="parte03" data-width="1920" data-height="1080" data-duration="38.0333">
      <canvas id="p03-tela" width="1920" height="1080"></canvas>
      <div id="p03-vinheta"></div>
      <div id="p03-escuro"></div>
      <div id="p03-fonte" data-layout-ignore>Aa 0123456789</div>
    </div>
    <script>
      (function () {
        // relógio da parte: tween linear que chama host.render(t); o motor (cena.js) pendura a cena nele.
        // O HyperFrames roda este script mais de uma vez (cópia escondida e cópia visível): cada passada avisa o motor.
        var id = "parte03";
        var raiz = document.getElementById("p03-raiz");
        var duracao = parseFloat(raiz.dataset.duration) || 38.0333;
        var relogio = { t: 0 };
        var host = {
          relogio: relogio,
          duracao: duracao,
          tela: document.getElementById("p03-tela"),
          escuro: document.getElementById("p03-escuro"),
          // vertical quando o host que monta a cena é mais alto que largo (cortes 9:16)
          vars: { formato: raiz.parentElement && Number(raiz.parentElement.dataset.height) > Number(raiz.parentElement.dataset.width) ? "vertical" : "horizontal" },
          render: null,
        };
        window["__" + id] = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady[id] = new Promise(function (resolve) {
          host.pronto = resolve;
        });
        var tl = gsap.timeline({ paused: true });
        tl.to(relogio, { t: duracao, duration: duracao, ease: "none", onUpdate: function () { if (host.render) host.render(relogio.t); } });
        host.tl = tl;
        if (window.__extras && window.__extras[id]) window.__extras[id](tl, raiz);
        window.__timelines = window.__timelines || {};
        window.__timelines[id] = tl;
        if (window.__aoHost && window.__aoHost[id]) window.__aoHost[id](host);
      })();
    </script>
    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      import { iniciarParte, tempos, MEDIDAS, trilha } from "./assets/js/cena.js";
      import { criarCarro, COR } from "./assets/js/mundo.js";
      import { PALAVRAS } from "./assets/js/tempos/v1-parte03.js";

      const T = tempos(PALAVRAS);
      const PI = Math.PI;
      const ALT = MEDIDAS.quadrilEmPe;
      const SENTADO = 0.53;
      const t = {
        liberdade: T("liberdade") - 0.15,
        entra: T("Você") - 0.2,
        luzes: T("todas", 2) - 0.15,
        ninguem: T("e ninguém") - 0.15,
        tenis: T("Você pega") - 0.2,
        vitrine: T("o celular") - 0.15,
        praca: T("come") - 0.2,
        conc: T("Você entra em") - 0.2,
        chave: T("pega a chave") - 0.2,
        carro: T("carro") - 0.1,
        dirige: T("e dirige") - 0.15,
        semaforo: T("sem semáforo") - 0.15,
        aereo: T("sem ninguém") - 0.15,
        seu: T("Por um") - 0.2,
      };
      const FIM = 38.0333;
      let vermelho = null;
      // onde o carro vermelho está na avenida em cada plano (x, z, giro)
      function posCarro(tt) {
        if (tt >= t.dirige && tt < t.semaforo) return [5.6, trilha([[t.dirige, 70], [t.semaforo, -35, "linear"]], tt), PI / 2];
        if (tt >= t.semaforo && tt < t.aereo) return [5.6, trilha([[t.semaforo, 14], [t.aereo, -62, "linear"]], tt), PI / 2];
        if (tt >= t.aereo && tt < t.seu) return [5.6, trilha([[t.aereo, 40], [t.seu, -8, "linear"]], tt), PI / 2];
        if (tt >= t.seu) return [0.5, -55, PI / 2 + 0.35];
        return null;
      }

      iniciarParte({
        host: "__parte03",
        cenarios: ["cidade", "shopping", "concessionaria"],
        planos: [
          { de: 0, cenario: "cidade", nome: "abre" }, //                  Nas primeiras horas, o medo vira outra coisa,
          { de: t.liberdade, cenario: "cidade", nome: "liberdade" }, //   liberdade.
          { de: t.entra, cenario: "shopping", nome: "entra" }, //         Você entra no shopping, todas as lojas abertas,
          { de: t.luzes, cenario: "shopping", nome: "luzes" }, //         todas as luzes acesas
          { de: t.ninguem, cenario: "shopping", nome: "ninguem" }, //     e ninguém para te impedir.
          { de: t.tenis, cenario: "shopping", nome: "tenis" }, //         Você pega o tênis que sempre quis,
          { de: t.vitrine, cenario: "shopping", nome: "vitrine" }, //     o celular mais caro da vitrine,
          { de: t.praca, cenario: "shopping", nome: "praca" }, //         come tudo que dá vontade na praça de alimentação.
          { de: t.conc, cenario: "concessionaria", nome: "conc" }, //     Você entra em uma concessionária,
          { de: t.chave, cenario: "concessionaria", nome: "chave" }, //   pega a chave
          { de: t.carro, cenario: "concessionaria", nome: "carroV" }, //  do carro mais bonito
          { de: t.dirige, cenario: "cidade", nome: "dirige" }, //         e dirige a 200 por hora pela avenida,
          { de: t.semaforo, cenario: "cidade", nome: "semaforo" }, //     sem semáforo, sem multa,
          { de: t.aereo, cenario: "cidade", nome: "aereo" }, //           sem ninguém.
          { de: t.seu, cenario: "cidade", nome: "seu" }, //               Por um dia inteiro, o mundo é seu.
        ],
        cortesEscuros: [t.entra, t.conc, t.dirige],
        cameras: {
          abre: { k: [[0, [1.3, 1.25, -3.4], [0.5, 1.45, 0], 38], [t.liberdade, [1.1, 1.3, -2.9], [0.5, 1.45, 0], 36]], tremor: 0.004 },
          liberdade: { k: [[t.liberdade, [1.4, 1.5, -3.6], [0.5, 1.5, 0], 40], [t.entra, [4.5, 8.5, -11], [0.5, 1.0, 0], 46, "ambos"]], tremor: 0.003 },
          entra: { k: [[t.entra, [2.6, 2.3, 4], [0, 1.4, 22], 50], [t.luzes, [2.3, 2.2, 6], [0, 1.4, 18], 50]], tremor: 0.003 },
          luzes: { k: [[t.luzes, [0.4, 1.0, 12], [0, 7.0, -8], 62], [t.ninguem, [0.4, 1.0, 9], [0, 7.0, -12], 62]], tremor: 0.002 },
          ninguem: { k: [[t.ninguem, [5, 6.5, 32], [0, 0.5, 2], 46], [t.tenis, [4.6, 6.8, 31], [0, 0.5, 0], 46]], tremor: 0.002 },
          tenis: { k: [[t.tenis, [-2.5, 1.45, 20.0], [-4.1, 1.05, 21.0], 38], [t.vitrine, [-2.65, 1.5, 20.25], [-3.9, 1.15, 21.1], 38]], tremor: 0.004 },
          vitrine: { k: [[t.vitrine, [3.55, 1.36, 15.35], [4.3, 1.2, 14.55], 26], [t.praca, [3.75, 1.32, 15.15], [4.3, 1.2, 14.55], 24]], tremor: 0.002 },
          praca: { k: [[t.praca, [4.5, 3.2, -14.5], [-3, 0.8, -22], 42], [t.conc, [2.0, 2.2, -17.5], [-3, 0.9, -21.8], 40]], tremor: 0.003 },
          conc: { k: [[t.conc, [-10.5, 3.6, 7.2], [1, 0.8, -1], 50], [t.chave, [-9.5, 3.2, 7.4], [2, 0.9, -2], 48]], tremor: 0.003 },
          chave: { k: [[t.chave, [10.6, 1.6, -7.4], [9.25, 1.45, -8.8], 36], [t.carro, [10.4, 1.55, -7.6], [9.25, 1.45, -8.8], 34]], tremor: 0.003 },
          carroV: { k: [[t.carro, [-4.2, 0.95, 5.0], [0, 0.75, 0.5], 40], [t.dirige, [3.2, 0.95, 5.6], [0, 0.75, 0.5], 40, "linear"]], tremor: 0.002 },
          dirige: (tt, ctx) => {
            const [x, z] = posCarro(tt);
            const o = ctx.cenarios.cidade.grupo.position;
            return { pos: new THREE.Vector3(o.x + 3.0, 0.7, o.z - 10), alvo: new THREE.Vector3(o.x + x, 0.9, o.z + z), fov: 44 };
          },
          semaforo: { k: [[t.semaforo, [8.7, 1.3, -14.0], [3, 2.2, -26], 48], [t.aereo, [8.6, 1.35, -15.0], [3, 2.2, -27], 48]], tremor: 0.003 },
          aereo: (tt, ctx) => {
            const [x, z] = posCarro(tt);
            const o = ctx.cenarios.cidade.grupo.position;
            return { pos: new THREE.Vector3(o.x + x + 2, 26, o.z + z + 16), alvo: new THREE.Vector3(o.x + x, 0, o.z + z - 4), fov: 46 };
          },
          seu: { k: [[t.seu, [6.5, 1.1, -47.5], [0.5, 2.9, -55], 42], [FIM, [10, 3.2, -41], [0.5, 2.4, -55.5], 46, "ambos"]], tremor: 0.003 },
        },
        personagem: {
          onde: [[0, "cidade"], [t.entra, "shopping"], [t.conc, "concessionaria"], [t.dirige, "cidade"]],
          pos: [
            [0, [0.5, ALT, 0]],
            [t.entra - 0.01, [0.5, ALT, 0]],
            [t.entra, [0.2, ALT, 27]],
            [t.tenis - 0.01, [0.4, ALT, 12], "linear"],
            [t.tenis, [-3.55, ALT, 21.45]],
            [t.praca - 0.01, [-3.55, ALT, 21.45]],
            [t.praca, [-3, SENTADO, -21.2]],
            [t.conc - 0.01, [-3, SENTADO, -21.2]],
            [t.conc, [5.0, ALT, -1.8]],
            [t.chave - 0.01, [8.9, ALT, -6.4], "linear"],
            [t.chave, [9.35, ALT, -8.0]],
            [t.dirige - 0.01, [9.35, ALT, -8.0]],
            [t.dirige, [0.5, 1.58 + ALT, -55.2]],
          ],
          passos: [[t.entra, t.tenis - 0.05, 1], [t.conc, t.chave - 0.05, 1]],
          visivel: (tt, p) => ["abre", "liberdade", "entra", "luzes", "ninguem", "tenis", "praca", "conc", "chave", "seu"].includes(p.nome),
          pose: {
            giro: [[0, PI], [t.entra, PI, "corte"], [t.tenis, -PI / 2, "corte"], [t.praca, PI, "corte"], [t.conc, -0.9, "corte"], [t.chave, PI, "corte"], [t.seu, PI / 2 + 0.6, "corte"]],
            cabecaInclina: [[0, 0.45], [t.liberdade, 0.4], [t.liberdade + 0.5, -0.35, "sai"], [t.entra, 0.0], [t.luzes, -0.2], [t.ninguem, 0.0], [t.tenis, 0.3], [t.praca, 0.25], [t.conc, 0.0], [t.chave, 0.1], [t.seu, -0.25]],
            cabecaGiro: [[0, 0.0], [t.entra, -0.3], [t.entra + 1.8, 0.35], [t.ninguem, 0], [t.tenis, -0.2], [t.conc, 0.4], [t.chave, 0]],
            apertar: [[0, 0.35], [t.liberdade, 0.3], [t.liberdade + 0.4, 0.0]],
            ombro: [[0, 0.0], [t.liberdade, 0.0], [t.liberdade + 0.6, -0.25, "sai"], [t.entra, 0.0], [t.seu, 0.0], [t.seu + 0.6, -0.25, "sai"]],
            abertura: [[0, 0.1], [t.liberdade, 0.1], [t.liberdade + 0.6, 1.35, "sai"], [t.entra, 0.12], [t.seu, 0.12], [t.seu + 0.7, 1.4, "sai"]],
            cotovelo: [[0, 0.15], [t.liberdade + 0.6, 0.05], [t.entra, 0.15], [t.praca, 0.9]],
            quadril: [[0, 0], [t.praca, -PI / 2], [t.conc, 0]],
            joelho: [[0, 0], [t.praca, PI / 2], [t.conc, 0]],
            olhos: [[0, 0.8], [t.liberdade + 0.3, 1], [t.luzes + 0.5, 1], [t.luzes + 0.56, 0.05], [t.luzes + 0.64, 1]],
          },
          // mão direita: pega o tênis, leva a comida à boca, pega a chave
          maos: (tt, pts, ctx) => {
            if (tt >= t.tenis && tt < t.vitrine) {
              const k = trilha([[T("pega"), 0], [T("tênis"), 1, "ambos"], [T("tênis") + 0.9, 1], [T("tênis") + 1.4, 0.6, "ambos"]], tt);
              const alvo = new THREE.Vector3(-4.12, 1.12, 21.0).add(ctx.cenarios.shopping.grupo.position);
              const peito = pts.cabeca.clone().add(new THREE.Vector3(-0.25, -0.55, -0.15));
              return { alvoD: tt > T("tênis") + 0.9 ? alvo.clone().lerp(peito, (tt - T("tênis") - 0.9) / 0.5 > 1 ? 1 : (tt - T("tênis") - 0.9) / 0.5) : alvo, pesoD: k };
            }
            if (tt >= t.praca && tt < t.conc) {
              const mordida = Math.max(0, Math.sin((tt - t.praca) * 2.6));
              const boca = pts.cabeca.clone().add(new THREE.Vector3(0.05, -0.12, -0.16));
              return { alvoD: boca, pesoD: mordida };
            }
            if (tt >= t.chave && tt < t.carro) {
              const alvo = new THREE.Vector3(9.31, 1.32, -8.8).add(ctx.cenarios.concessionaria.grupo.position);
              return { alvoD: alvo, pesoD: trilha([[t.chave, 0], [T("chave"), 1, "ambos"], [t.carro, 0.8]], tt) };
            }
            return null;
          },
        },
        montar: (ctx) => {
          vermelho = criarCarro(99, { cor: COR.vermelho });
          vermelho.visible = false;
          ctx.cenarios.cidade.grupo.add(vermelho);
        },
        quadro: (tt, plano, ctx) => {
          ctx.cenarios.cidade.fumaca(false);
          const p = posCarro(tt);
          vermelho.visible = !!p && plano.cenario === "cidade";
          if (p) {
            vermelho.position.set(p[0], 0, p[1]);
            vermelho.rotation.y = p[2];
          }
          // o tênis sai do pedestal com a mão; a chave sai do quadro
          const sh = ctx.cenarios.shopping;
          const tenis = sh.tenis.children[1];
          if (tt >= T("tênis") && tt < t.vitrine) {
            const m = new THREE.Vector3();
            ctx.boneco.userData.rig.bracoD.pega.getWorldPosition(m);
            sh.tenis.worldToLocal(m);
            tenis.position.copy(m);
          } else {
            tenis.position.set(0, 1.02, 0);
          }
          const cc = ctx.cenarios.concessionaria;
          if (tt >= T("chave") && tt < t.carro) {
            const m = new THREE.Vector3();
            ctx.boneco.userData.rig.bracoD.pega.getWorldPosition(m);
            cc.grupo.worldToLocal(m);
            cc.chave.position.copy(m);
          } else {
            cc.chave.position.set(9.31, 1.43, -8.83);
          }
        },
      });

    </script>
  </body>
</html>
